name: discuss-read
description: "阅读一个讨论的所有帖子，生成摘要"
triggers: ["阅读", "read thread"]
input:
  category: string
  thread: string
steps:
  - name: fetch_posts
    type: code
    command: "python3 steps/fetch_posts.py"
  - name: mark_read
    type: code
    command: "python3 steps/mark_read.py"
output: fetch_posts
