name: discuss-summarize
description: "为讨论生成或更新 SUMMARY.md（只有发起者可以执行）"
triggers: ["生成摘要", "summarize thread"]
input:
  category: string
  thread: string
steps:
  - name: gather
    type: code
    command: "python3 steps/gather.py"
  - name: generate_summary
    type: llm
    model: reasoning
    prompt: |
      根据以下讨论的所有帖子，生成一个时间线式的 SUMMARY 文档。

      讨论内容：
      {{gather.output.posts}}

      要求：返回一个 JSON 对象，只有一个字段 "summary"，值是一段 Markdown 文字。
      内容按时间顺序组织，每个帖子一行，用表格格式：| 时间 | 作者 | 要点 |。
      用内容的语言撰写。不要返回任何其他字段。

      示例：{"summary": "# 讨论摘要\n\n| 时间 | 作者 | 要点 |\n|---|---|---|\n| 2026-04-08 | ken | 提出方案... |"}
    schema: schemas/summary.json
    retry: 2
  - name: publish
    type: code
    command: "python3 steps/publish.py"
output: publish
