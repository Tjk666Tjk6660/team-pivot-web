name: discuss-result
description: "生成 RESULT.md 并把状态改为 concluded（只有发起者可以执行）"
triggers: ["生成结论", "generate result"]
input:
  category: string
  thread: string
steps:
  - name: gather
    type: code
    command: "python3 steps/gather.py"
  - name: generate_result
    type: llm
    model: reasoning
    prompt: |
      根据以下讨论，生成结论文档。

      讨论内容：
      {{gather.output.posts}}

      要求：返回一个 JSON 对象，只有一个字段 "result_body"，值是一段 Markdown 文字。
      内容包含以下 section：## 背景、## 讨论的选项、## 最终决定、## 后续行动项。
      用内容的语言撰写。不要返回任何其他字段。

      示例：{"result_body": "# 讨论结论\n\n## 背景\n...\n\n## 讨论的选项\n...\n\n## 最终决定\n...\n\n## 后续行动项\n- [ ] ..."}
    schema: schemas/result.json
    retry: 2
  - name: publish
    type: code
    command: "python3 steps/publish.py"
output: publish
