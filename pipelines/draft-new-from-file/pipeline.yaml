name: draft-new-from-file
description: 上传文件（.md/.txt/.docx/.doc/.pdf）转换为草稿
triggers:
  - "upload draft"
  - "文件转草稿"
  - "上传草稿"

input:
  file_path: string       # 上传文件的绝对路径（由 EC 保存）
  type: string            # "proposal" 或 "reply"，默认 proposal
  category: string
  title: string           # 可选，空则用文件名（去扩展名）
  thread: string          # 仅 reply 需要

steps:
  - name: convert
    type: code
    command: "python3 steps/convert.py"

output: convert
