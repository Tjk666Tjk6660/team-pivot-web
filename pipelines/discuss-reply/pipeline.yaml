name: discuss-reply
description: >
  Reply to an existing discussion thread using a draft. The draft must
  be created first via draft-new (type=reply) or draft-new-from-file.
  The draft will be deleted after successful publication.
triggers: ["reply", "respond"]
input:
  draft_id: string
  mention_users: string
  mention_comments: string
steps:
  - name: prepare
    type: code
    command: "python3 steps/prepare.py"
  - name: generate_summary
    type: llm
    model: standard
    skip_if: "prepare.output.has_summary"
    prompt: |
      Generate a notification summary for the following discussion reply.

      Reply content:
      {{prepare.output.content}}

      Return a JSON object with exactly one field "summary" (string).
      The summary should include: a brief overview (3-5 sentences) and
      1-2 key highlights. Write in the same language as the content.
      Do not include any other fields.

      Example: {"summary": "Overview: The respondent suggests prioritizing... Highlights: 1) ...; 2) ..."}
    schema: schemas/summary.json
    retry: 2
  - name: publish
    type: code
    command: "python3 steps/publish.py"
  - name: cleanup
    type: code
    command: "python3 steps/cleanup.py"
output: publish
