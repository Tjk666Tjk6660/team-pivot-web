[project]
name = "team-pivot-web"
version = "0.2.0"
description = "Team matter workspace Web client with Feishu OAuth"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "lark-oapi>=1.4",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "pypinyin>=0.55.0",
    "bcrypt>=4.0",
    "email-validator>=2.0",
    # Used by daily_report.window for `Asia/Shanghai`. Linux ships IANA
    # tzdata via the system; Windows does not, and `zoneinfo` raises
    # ZoneInfoNotFoundError. Including unconditionally is the simplest
    # cross-platform fix; the wheel is small.
    "tzdata>=2025.2",
    "pydantic[email]>=2.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
